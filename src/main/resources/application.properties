spring.application.name=ai-developer-copilot
spring.datasource.url=jdbc:mysql://localhost:3306/ai-developer-copilot?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# PostgreSQL + pgvector
postgres.datasource.url=jdbc:postgresql://localhost:5432/ai_developer_copilot
postgres.datasource.username=postgres
postgres.datasource.password=${POSTGRES_PASSWORD}
postgres.datasource.driver-class-name=org.postgresql.Driver